name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows is the tested platform; macOS/Linux results are informational for now.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint & security scan
        run: |
          python -m ruff check scribeos
          python -m bandit -q -r scribeos -c pyproject.toml
          python -m pip_audit
      - name: Tests
        run: python -m pytest tests --ignore=tests/e2e
      - name: Browser end-to-end tests
        if: runner.os == 'Windows'
        run: python -m pytest tests/e2e
        env:
          SCRIBEOS_E2E_BROWSER: msedge

  package-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cd web && npm ci && npm run build
      - run: python -m pip install -e ".[dev,voice]"
      - run: python -m PyInstaller packaging/scribeos.spec --noconfirm --distpath build/dist --workpath build/work
      - run: build/dist/ScribeOS/ScribeOS.exe --self-test selftest.json
      - run: choco install innosetup -y && iscc packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScribeOS-Setup
          path: build/installer/*.exe
